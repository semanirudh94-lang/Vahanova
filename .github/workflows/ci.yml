name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'fix/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Firestore rules test dependency
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@6.0.0
      - name: Test Firestore security rules in emulator
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-vahanova-rules "node --test tests/firestore.rules.test.mjs"
